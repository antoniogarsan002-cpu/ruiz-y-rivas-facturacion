<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruiz y Rivas Consultores - Gestión</title>
  <style>
    :root { --primary:#3157d5; --primary-dark:#2443ac; --soft:#eef2ff; --ink:#172033; --muted:#667085; --line:#e5e7eb; --bg:#f6f8fc; --green:#16803c; --green-bg:#e9f8ee; --orange:#b54708; --orange-bg:#fff3e8; --red:#b42318; --red-bg:#fff0ee; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; display:flex; }
    .sidebar { width:245px; flex:0 0 245px; background:#fff; border-right:1px solid var(--line); padding:22px 14px; }
    .brand { display:flex; align-items:center; gap:10px; padding:0 10px 24px; }
    .brand-mark { width:35px; height:35px; border-radius:10px; display:grid; place-items:center; background:var(--primary); color:white; font-weight:800; }
    .brand strong { display:block; font-size:13px; line-height:1.2; }
    .brand small { color:var(--muted); font-size:11px; }
    .nav-label { color:#98a2b3; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:14px 12px 7px; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav button { border:0; background:transparent; color:#475467; text-align:left; border-radius:9px; padding:10px 12px; font-size:14px; display:flex; align-items:center; gap:10px; }
    .nav button:hover, .nav button.active { color:var(--primary); background:var(--soft); font-weight:700; }
    .nav .icon { width:20px; text-align:center; font-size:16px; }
    .side-note { margin:22px 8px 0; border-radius:12px; background:linear-gradient(135deg,#eef2ff,#f7f4ff); padding:13px; font-size:12px; color:#475467; line-height:1.45; }
    .side-note strong { display:block; color:var(--primary); margin-bottom:3px; }
    .content { flex:1; min-width:0; }
    .topbar { background:#fff; border-bottom:1px solid var(--line); padding:15px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .topbar h1 { margin:0; font-size:22px; }
    .topbar p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .top-actions { display:flex; gap:9px; align-items:center; }
    .search { width:190px; border:1px solid var(--line); border-radius:9px; padding:9px 11px; color:var(--muted); }
    .primary, .secondary, .ghost { border:0; border-radius:9px; padding:10px 14px; font-weight:700; font-size:13px; }
    .primary { color:white; background:var(--primary); }
    .primary:hover { background:var(--primary-dark); }
    .secondary { color:var(--primary); background:var(--soft); }
    .ghost { color:#475467; background:#f8fafc; border:1px solid var(--line); }
    .workspace { padding:25px 28px 40px; max-width:1320px; }
    .view-title { display:flex; align-items:flex-start; justify-content:space-between; gap:15px; margin-bottom:20px; }
    .view-title h2 { margin:0; font-size:21px; }
    .view-title p { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:14px; margin-bottom:20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 5px 16px rgba(16,24,40,.04); }
    .metric { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .metric .label { color:var(--muted); font-size:12px; }
    .metric .number { margin-top:7px; font-size:24px; font-weight:800; }
    .metric .change { margin-top:8px; font-size:11px; color:var(--green); }
    .metric-icon { width:36px; height:36px; display:grid; place-items:center; border-radius:10px; color:var(--primary); background:var(--soft); }
    .grid-2 { display:grid; grid-template-columns:1.35fr 1fr; gap:18px; }
    .card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; }
    .card-head h3 { margin:0; font-size:16px; }
    .card-head a { color:var(--primary); font-size:12px; font-weight:700; cursor:pointer; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; color:#98a2b3; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
    td { font-size:13px; padding:13px 8px; border-bottom:1px solid #f0f2f5; white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    td.amount, th.amount { text-align:right; }
    .status { display:inline-flex; align-items:center; border-radius:20px; padding:5px 9px; font-size:11px; font-weight:700; }
    .paid { color:var(--green); background:var(--green-bg); }
    .pending { color:var(--orange); background:var(--orange-bg); }
    .draft { color:#475467; background:#f2f4f7; }
    .rejected { color:var(--red); background:var(--red-bg); }
    .progress-row { margin:15px 0; }
    .progress-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:7px; }
    .progress-label span:last-child { color:var(--muted); }
    .progress { height:8px; border-radius:9px; background:#eef0f4; overflow:hidden; }
    .progress i { display:block; height:100%; border-radius:9px; background:var(--primary); }
    .feature-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .feature { border:1px solid var(--line); border-radius:12px; padding:15px; background:#fff; }
    .feature .ficon { font-size:20px; margin-bottom:8px; }
    .feature strong { display:block; font-size:13px; }
    .feature span { display:block; color:var(--muted); font-size:12px; line-height:1.4; margin-top:4px; }
    .toolbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar input, .toolbar select, .form input, .form select, .form textarea { border:1px solid #d0d5dd; border-radius:8px; padding:10px 11px; background:#fff; color:var(--ink); }
    .toolbar input { min-width:220px; }
    .list-card { overflow:hidden; }
    .empty { color:var(--muted); text-align:center; padding:35px 10px; font-size:13px; }
    .two-columns { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .form label { display:block; font-size:12px; font-weight:700; margin:12px 0 5px; }
    .form input, .form select, .form textarea { width:100%; }
    .form textarea { min-height:80px; resize:vertical; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .form-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:18px; }
    .mini-info { border-radius:10px; background:#f8fafc; padding:12px; color:#475467; font-size:12px; line-height:1.5; margin-top:14px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(16,24,40,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:#fff; border-radius:16px; padding:23px; box-shadow:0 20px 55px rgba(16,24,40,.25); }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .modal-head h3 { margin:0; font-size:19px; }
    .close { border:0; background:#f2f4f7; border-radius:50%; width:30px; height:30px; color:#667085; }
    .toast { position:fixed; right:22px; bottom:22px; z-index:20; max-width:340px; padding:13px 16px; border-radius:11px; color:#fff; background:#172033; box-shadow:0 12px 30px rgba(16,24,40,.22); font-size:13px; opacity:0; transform:translateY(12px); pointer-events:none; transition:.22s ease; }
    .toast.show { opacity:1; transform:translateY(0); }
    .chart { display:flex; height:180px; align-items:flex-end; gap:12px; padding:20px 5px 0; border-bottom:1px solid var(--line); }
    .bar-wrap { flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; }
    .bar { width:100%; max-width:34px; border-radius:7px 7px 0 0; background:linear-gradient(#6d5dfc,var(--primary)); min-height:8px; }
    .bar-label { color:var(--muted); font-size:11px; }
    .setting-line { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:14px 0; gap:15px; }
    .setting-line:last-child { border-bottom:0; }
    .setting-line strong { display:block; font-size:13px; }
    .setting-line span { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
    .switch { width:40px; height:22px; border-radius:20px; background:var(--primary); position:relative; }
    .switch:after { content:''; position:absolute; right:3px; top:3px; width:16px; height:16px; border-radius:50%; background:#fff; }
    @media (max-width:900px) { .sidebar { width:210px; flex-basis:210px; } .cards { grid-template-columns:repeat(2,1fr); } .grid-2, .two-columns { grid-template-columns:1fr; } }
    @media (max-width:650px) { .app { display:block; } .sidebar { width:100%; padding:12px; border-right:0; border-bottom:1px solid var(--line); } .brand { padding-bottom:10px; } .nav-label, .side-note { display:none; } .nav { display:grid; grid-template-columns:repeat(4,1fr); } .nav button { padding:8px 3px; justify-content:center; flex-direction:column; gap:2px; font-size:10px; } .nav button:nth-child(n+9) { display:none; } .topbar { padding:14px 16px; } .topbar p, .search { display:none; } .workspace { padding:18px 16px 28px; } .cards { gap:9px; } .card { padding:14px; } .metric .number { font-size:19px; } .feature-grid { grid-template-columns:1fr 1fr; } }
    @media print { .sidebar, .topbar, .view-title button, .toolbar, .modal-backdrop { display:none !important; } .app, .content { display:block; } .workspace { padding:0; } .card { box-shadow:none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">RR</div>
        <div><strong>Ruiz y Rivas<br>Consultores</strong><small>Panel de gestión</small></div>
      </div>
      <div class="nav-label">Principal</div>
      <nav class="nav">
        <button data-view="inicio" class="active"><span class="icon">⌂</span>Inicio</button>
        <button data-view="facturas"><span class="icon">▤</span>Facturas</button>
        <button data-view="presupuestos"><span class="icon">☷</span>Presupuestos</button>
        <button data-view="clientes"><span class="icon">♙</span>Clientes</button>
        <button data-view="productos"><span class="icon">▦</span>Productos</button>
        <button data-view="gastos"><span class="icon">↓</span>Gastos</button>
        <button data-view="cobros"><span class="icon">€</span>Cobros</button>
      </nav>
      <div class="nav-label">Control</div>
      <nav class="nav">
        <button data-view="informes"><span class="icon">◒</span>Informes</button>
        <button data-view="configuracion"><span class="icon">⚙</span>Configuración</button>
      </nav>
      <div class="side-note"><strong>✓ Verifactu preparado</strong>Esta demo incluye un espacio para la configuración de facturación electrónica y numeración.</div>
    </aside>
    <section class="content">
      <header class="topbar">
        <div><h1 id="pageTitle">Inicio</h1><p id="pageSubtitle">Resumen de la actividad de tu negocio</p></div>
        <div class="top-actions"><input id="globalSearch" class="search" placeholder="Buscar..."><button class="primary" data-action="new-invoice">+ Nueva factura</button></div>
      </header>
      <main id="workspace" class="workspace"></main>
    </section>
  </div>
  <div id="modalBackdrop" class="modal-backdrop"><div id="modal" class="modal"></div></div>
  <div id="toast" class="toast"></div>

  <script>
    var state = {
      view: 'inicio',
      clients: [
        { id:1, name:'María López', detail:'maria@ejemplo.com', tax:'12345678A' },
        { id:2, name:'Construcciones Norte S.L.', detail:'admin@norte.es', tax:'B12345678' },
        { id:3, name:'Estudio Marín', detail:'hola@estudiomarin.es', tax:'B87654321' }
      ],
      products: [
        { id:1, name:'Consultoría empresarial', code:'CONS-001', price:850 },
        { id:2, name:'Diseño de logotipo', code:'DIS-001', price:250 },
        { id:3, name:'Mantenimiento mensual', code:'MANT-001', price:450 }
      ],
      invoices: [
        { id:'F-2026-004', client:'Estudio Marín', date:'22/10/2026', status:'Pagada', total:2450 },
        { id:'F-2026-003', client:'Construcciones Norte S.L.', date:'18/10/2026', status:'Pendiente', total:1340 },
        { id:'F-2026-002', client:'María López', date:'10/10/2026', status:'Pagada', total:850 },
        { id:'F-2026-001', client:'Servicios Delta', date:'02/10/2026', status:'Borrador', total:620 }
      ],
      quotes: [
        { id:'P-2026-006', client:'Talleres Vega', date:'21/10/2026', status:'Pendiente', total:1890 },
        { id:'P-2026-005', client:'Construcciones Norte S.L.', date:'16/10/2026', status:'Aceptado', total:1340 },
        { id:'P-2026-004', client:'Estudio Marín', date:'09/10/2026', status:'Rechazado', total:920 }
      ],
      expenses: [
        { id:'G-014', supplier:'Papelería Central', date:'20/10/2026', category:'Material', total:86.40 },
        { id:'G-013', supplier:'Internet y teléfono', date:'15/10/2026', category:'Suministros', total:74.90 },
        { id:'G-012', supplier:'Alquiler oficina', date:'01/10/2026', category:'Oficina', total:620 }
      ],
      accounts: [
        { id:1, name:'Cuenta principal', iban:'ES00 0000 0000 0000 0000 0000' },
        { id:2, name:'Cuenta secundaria', iban:'ES00 0000 0000 0000 0000 0001' }
      ]
    };
    var storageKey = 'ruiz-rivas-facturacion-v2';
    try {
      var saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
      if (saved) {
        state.clients = saved.clients || state.clients;
        state.products = saved.products || state.products;
        state.invoices = saved.invoices || state.invoices;
        state.quotes = saved.quotes || state.quotes;
        state.expenses = saved.expenses || state.expenses;
        state.accounts = saved.accounts || state.accounts;
      }
    } catch (e) {}
    var euro = function(n) { return Number(n).toLocaleString('es-ES', { style:'currency', currency:'EUR' }); };
    var esc = function(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]; }); };
    var today = function() { return new Date().toLocaleDateString('es-ES'); };
    var statusClass = function(s) { return s === 'Pagada' || s === 'Aceptado' ? 'paid' : s === 'Pendiente' || s === 'Enviada' ? 'pending' : s === 'Rechazado' ? 'rejected' : 'draft'; };
    var statusBadge = function(s) { return '<span class="status ' + statusClass(s) + '">' + esc(s) + '</span>'; };
    var paymentLabel = function(i) { if (!i.paymentMethod) return '—'; var labels = { transferencia:'Transferencia', recibo:'Recibo', tarjeta:'Tarjeta', efectivo:'Efectivo' }; return '<strong>' + (labels[i.paymentMethod] || esc(i.paymentMethod)) + '</strong>' + (i.paymentAccount ? '<br><small style="color:#667085">' + esc(i.paymentAccount) + '</small>' : ''); };
    var $ = function(id) { return document.getElementById(id); };
    function saveState() {
      try { localStorage.setItem(storageKey, JSON.stringify({ clients:state.clients, products:state.products, invoices:state.invoices, quotes:state.quotes, expenses:state.expenses, accounts:state.accounts })); } catch (e) {}
    }
    function toast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(function() { $('toast').classList.remove('show'); }, 2600);
    }

    function setPageMeta(title, subtitle) {
      $('pageTitle').textContent = title;
      $('pageSubtitle').textContent = subtitle;
      document.querySelectorAll('[data-view]').forEach(function(b) { b.classList.toggle('active', b.dataset.view === state.view); });
    }

    function render() {
      var views = { inicio:renderHome, facturas:renderInvoices, presupuestos:renderQuotes, clientes:renderClients, productos:renderProducts, gastos:renderExpenses, cobros:renderPayments, informes:renderReports, configuracion:renderSettings };
      (views[state.view] || renderHome)();
      saveState();
    }

    function renderHome() {
      setPageMeta('Inicio', 'Resumen de la actividad de tu negocio');
      var sales = state.invoices.filter(function(i) { return i.status === 'Pagada'; }).reduce(function(a,i) { return a + i.total; }, 0);
      var pending = state.invoices.filter(function(i) { return i.status === 'Pendiente'; }).reduce(function(a,i) { return a + i.total; }, 0);
      var expenses = state.expenses.reduce(function(a,i) { return a + i.total; }, 0);
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Buenos días 👋</h2><p>Aquí tienes lo más importante de Ruiz y Rivas Consultores.</p></div><button class="secondary" data-action="print">Imprimir resumen</button></div>' +
        '<div class="cards">' + metric('Ventas cobradas', euro(sales), '+12,4% este mes', '↗') + metric('Pendiente de cobro', euro(pending), '2 facturas abiertas', '◷') + metric('Gastos del mes', euro(expenses), '3 gastos registrados', '↓') + metric('Clientes', state.clients.length, '+1 este mes', '♙') + '</div>' +
        '<div class="grid-2"><div class="card"><div class="card-head"><h3>Últimas facturas</h3><a data-view-link="facturas">Ver todas</a></div>' + invoiceTable(state.invoices.slice(0,4)) + '</div>' +
        '<div class="card"><div class="card-head"><h3>Estado del negocio</h3><span class="status paid">Actualizado</span></div>' +
          '<div class="progress-row"><div class="progress-label"><span>Facturas pagadas</span><span>68%</span></div><div class="progress"><i style="width:68%"></i></div></div>' +
          '<div class="progress-row"><div class="progress-label"><span>Presupuestos aceptados</span><span>54%</span></div><div class="progress"><i style="width:54%"></i></div></div>' +
          '<div class="progress-row"><div class="progress-label"><span>Gastos controlados</span><span>82%</span></div><div class="progress"><i style="width:82%"></i></div></div>' +
          '<div class="mini-info">💡 Consejo: convierte los presupuestos aceptados en factura con un solo clic.</div></div></div>' +
        '<div class="card" style="margin-top:18px"><div class="card-head"><h3>Todo lo que puedes gestionar</h3><span style="color:#667085;font-size:12px">Demo interactiva</span></div><div class="feature-grid">' +
          feature('▤','Facturas','Crear, enviar, cobrar y controlar estados.') + feature('☷','Presupuestos','Preparar propuestas y convertirlas en facturas.') + feature('♙','Clientes','Guardar contactos y datos fiscales.') + feature('▦','Productos','Catálogo de servicios, precios e IVA.') + feature('↓','Gastos','Registrar compras y gastos del negocio.') + feature('◒','Informes','Ver ventas, gastos y beneficio.') + '</div></div>';
    }

    function metric(label, number, change, icon) { return '<div class="card metric"><div><div class="label">' + label + '</div><div class="number">' + number + '</div><div class="change">' + change + '</div></div><div class="metric-icon">' + icon + '</div></div>'; }
    function feature(icon, name, desc) { return '<div class="feature"><div class="ficon">' + icon + '</div><strong>' + name + '</strong><span>' + desc + '</span></div>'; }
    function invoiceTable(items) {
      if (!items.length) return '<div class="empty">No hay facturas.</div>';
      return '<div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th>Cobro</th><th class="amount">Total</th></tr></thead><tbody>' + items.map(function(i) { return '<tr><td><strong>' + esc(i.id) + '</strong></td><td>' + esc(i.client) + '</td><td>' + i.date + '</td><td>' + statusBadge(i.status) + '</td><td>' + paymentLabel(i) + '</td><td class="amount">' + euro(i.total) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }

    function renderInvoices() {
      setPageMeta('Facturas', 'Crea y controla tus facturas de venta');
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Tus facturas</h2><p>Numeración, IVA, estados y seguimiento de cobros.</p></div><button class="primary" data-action="new-invoice">+ Nueva factura</button></div>' +
        '<div class="toolbar"><input id="invoiceSearch" placeholder="Buscar por cliente o número..."><select id="invoiceFilter"><option value="">Todos los estados</option><option>Pagada</option><option>Pendiente</option><option>Borrador</option></select><button class="ghost" data-action="print">Imprimir listado</button></div>' +
        '<div class="card list-card">' + invoiceTable(state.invoices) + '</div>' +
        '<div class="feature-grid" style="margin-top:18px">' + feature('↻','Facturas recurrentes','Genera facturas mensuales automáticamente.') + feature('↩','Rectificativas','Corrige devoluciones o errores.') + feature('✉','Recordatorios','Avisa de pagos pendientes.') + '</div>';
      $('invoiceSearch').addEventListener('input', filterInvoices);
      $('invoiceFilter').addEventListener('change', filterInvoices);
    }
    function filterInvoices() {
      var q = $('invoiceSearch').value.toLowerCase(), f = $('invoiceFilter').value;
      var rows = state.invoices.filter(function(i) { return (!q || (i.client + i.id).toLowerCase().indexOf(q) >= 0) && (!f || i.status === f); });
      document.querySelector('.list-card').innerHTML = invoiceTable(rows);
    }

    function renderQuotes() {
      setPageMeta('Presupuestos', 'Prepara propuestas y conviértelas en facturas');
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Presupuestos</h2><p>Del presupuesto al cobro, sin volver a escribir los datos.</p></div><button class="primary" data-action="new-quote">+ Nuevo presupuesto</button></div>' +
        '<div class="card list-card"><table><thead><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th class="amount">Total</th><th></th></tr></thead><tbody>' +
        state.quotes.map(function(q) { return '<tr><td><strong>' + q.id + '</strong></td><td>' + esc(q.client) + '</td><td>' + q.date + '</td><td>' + statusBadge(q.status) + '</td><td class="amount">' + euro(q.total) + '</td><td><button class="secondary" data-action="convert-quote" data-id="' + q.id + '">Convertir en factura</button></td></tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="two-columns" style="margin-top:18px"><div class="card"><h3 style="margin:0 0 12px;font-size:16px">Flujo de venta</h3><div class="progress-row"><div class="progress-label"><span>1. Presupuesto</span><span>Enviado</span></div><div class="progress"><i style="width:100%"></i></div></div><div class="progress-row"><div class="progress-label"><span>2. Aceptación</span><span>Online</span></div><div class="progress"><i style="width:72%"></i></div></div><div class="progress-row"><div class="progress-label"><span>3. Factura</span><span>Un clic</span></div><div class="progress"><i style="width:48%"></i></div></div><div class="progress-row"><div class="progress-label"><span>4. Cobro</span><span>Seguimiento</span></div><div class="progress"><i style="width:35%"></i></div></div></div><div class="card"><h3 style="margin:0 0 12px;font-size:16px">Documentos disponibles</h3><div class="feature-grid" style="grid-template-columns:1fr 1fr">' + feature('▤','Proforma','Para anticipar una venta.') + feature('▥','Albarán','Para entregar productos.') + feature('↻','Recurrente','Para cuotas periódicas.') + feature('✉','Envío email','Comparte el documento.') + '</div></div></div>';
    }

    function renderClients() {
      setPageMeta('Clientes', 'Contactos, datos fiscales y seguimiento');
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Clientes</h2><p>Ten todos tus contactos ordenados en un solo lugar.</p></div><button class="primary" data-action="new-client">+ Nuevo cliente</button></div>' +
        '<div class="toolbar"><input id="clientSearch" placeholder="Buscar cliente..."><button class="ghost" data-action="import">Importar datos</button></div><div class="card list-card"><table><thead><tr><th>Cliente</th><th>Correo</th><th>NIF/CIF</th><th>Facturas</th><th></th></tr></thead><tbody>' +
        state.clients.map(function(c) { var count = state.invoices.filter(function(i) { return i.client === c.name; }).length; return '<tr><td><strong>' + esc(c.name) + '</strong></td><td>' + esc(c.detail) + '</td><td>' + esc(c.tax) + '</td><td>' + count + '</td><td><button class="ghost" data-action="client-detail" data-id="' + c.id + '">Ver ficha</button></td></tr>'; }).join('') + '</tbody></table></div>';
      $('clientSearch').addEventListener('input', function() { var q = this.value.toLowerCase(); document.querySelector('.list-card tbody').innerHTML = state.clients.filter(function(c) { return (c.name + c.detail).toLowerCase().indexOf(q) >= 0; }).map(function(c) { return '<tr><td><strong>' + esc(c.name) + '</strong></td><td>' + esc(c.detail) + '</td><td>' + esc(c.tax) + '</td><td>' + state.invoices.filter(function(i) { return i.client === c.name; }).length + '</td><td><button class="ghost">Ver ficha</button></td></tr>'; }).join(''); });
    }

    function renderProducts() {
      setPageMeta('Productos y servicios', 'Catálogo, precios e impuestos');
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Productos y servicios</h2><p>Guarda lo que vendes para añadirlo a una factura rápidamente.</p></div><button class="primary" data-action="new-product">+ Nuevo producto</button></div>' +
        '<div class="card list-card"><table><thead><tr><th>Nombre</th><th>Código</th><th>Precio sin IVA</th><th>Tipo</th><th></th></tr></thead><tbody>' + state.products.map(function(p) { return '<tr><td><strong>' + esc(p.name) + '</strong></td><td>' + esc(p.code) + '</td><td>' + euro(p.price) + '</td><td><span class="status paid">Servicio</span></td><td><button class="ghost">Editar</button></td></tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="mini-info">📦 Si vendes productos físicos, aquí también podrías controlar stock, almacenes y pedidos.</div>';
    }

    function renderExpenses() {
      setPageMeta('Gastos', 'Registra compras, tickets y gastos del negocio');
      var total = state.expenses.reduce(function(a,e) { return a + e.total; }, 0);
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Gastos</h2><p>Controla lo que pagas y cuánto te cuesta el negocio.</p></div><button class="primary" data-action="new-expense">+ Nuevo gasto</button></div>' +
        '<div class="cards">' + metric('Gastos registrados', euro(total), 'Este mes', '↓') + metric('Tickets pendientes', '2', 'De revisar', '▤') + metric('IVA soportado', euro(total * .21), 'Estimado', '€') + metric('Proveedores', '8', 'Activos', '♙') + '</div>' +
        '<div class="card list-card"><table><thead><tr><th>Número</th><th>Proveedor</th><th>Categoría</th><th>Fecha</th><th class="amount">Total</th></tr></thead><tbody>' + state.expenses.map(function(e) { return '<tr><td><strong>' + e.id + '</strong></td><td>' + esc(e.supplier) + '</td><td>' + esc(e.category) + '</td><td>' + e.date + '</td><td class="amount">' + euro(e.total) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="mini-info">📷 En una versión completa, podrías hacer una foto del ticket y extraer automáticamente proveedor, fecha, IVA e importe.</div>';
    }

    function renderPayments() {
      setPageMeta('Cobros', 'Sigue el dinero que te deben y lo que ya has cobrado');
      var pending = state.invoices.filter(function(i) { return i.status === 'Pendiente'; });
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Cobros</h2><p>Marca facturas como cobradas y controla los vencimientos.</p></div><button class="secondary" data-action="reminders">Enviar recordatorios</button></div>' +
        '<div class="cards">' + metric('Por cobrar', euro(pending.reduce(function(a,i) { return a + i.total; }, 0)), '2 facturas', '◷') + metric('Cobrado este mes', euro(3300), '+18% vs. anterior', '✓') + metric('Vencido', euro(0), 'Todo al día', '♡') + metric('Cobros online', '4', 'Este mes', '↗') + '</div>' +
        '<div class="card list-card"><div class="card-head"><h3>Facturas pendientes</h3><span class="status pending">Requieren atención</span></div><table><thead><tr><th>Factura</th><th>Cliente</th><th>Vencimiento</th><th class="amount">Importe</th><th></th></tr></thead><tbody>' +
        pending.map(function(i) { return '<tr><td><strong>' + i.id + '</strong></td><td>' + esc(i.client) + '</td><td>30/10/2026</td><td class="amount">' + euro(i.total) + '</td><td><button class="secondary" data-action="mark-paid" data-id="' + i.id + '">Marcar cobrada</button></td></tr>'; }).join('') + '</tbody></table></div>' +
        '<div class="feature-grid" style="margin-top:18px">' + feature('✉','Recordatorios automáticos','Envía un aviso antes o después del vencimiento.') + feature('↗','Enlace de pago','Permite pagar desde la factura.') + feature('⇄','Conciliación bancaria','Relaciona movimientos con facturas.') + '</div>';
    }

    function renderReports() {
      setPageMeta('Informes', 'Entiende cómo va tu negocio');
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Informes</h2><p>Una visión sencilla de ventas, gastos y beneficio.</p></div><button class="secondary" data-action="print">Exportar informe</button></div>' +
        '<div class="grid-2"><div class="card"><div class="card-head"><h3>Ingresos por mes</h3><span style="font-size:12px;color:#667085">2026</span></div><div class="chart"><div class="bar-wrap"><div class="bar" style="height:35%"></div><div class="bar-label">Ene</div></div><div class="bar-wrap"><div class="bar" style="height:46%"></div><div class="bar-label">Feb</div></div><div class="bar-wrap"><div class="bar" style="height:58%"></div><div class="bar-label">Mar</div></div><div class="bar-wrap"><div class="bar" style="height:44%"></div><div class="bar-label">Abr</div></div><div class="bar-wrap"><div class="bar" style="height:72%"></div><div class="bar-label">May</div></div><div class="bar-wrap"><div class="bar" style="height:86%"></div><div class="bar-label">Jun</div></div><div class="bar-wrap"><div class="bar" style="height:64%"></div><div class="bar-label">Jul</div></div><div class="bar-wrap"><div class="bar" style="height:93%"></div><div class="bar-label">Ago</div></div></div></div>' +
        '<div class="card"><div class="card-head"><h3>Informes disponibles</h3></div><div class="setting-line"><div><strong>Ventas por cliente</strong><span>Quién te compra más</span></div><button class="ghost">Ver</button></div><div class="setting-line"><div><strong>Ingresos y gastos</strong><span>Resultado del negocio</span></div><button class="ghost">Ver</button></div><div class="setting-line"><div><strong>IVA e impuestos</strong><span>Datos para revisar con tu asesor</span></div><button class="ghost">Ver</button></div><div class="setting-line"><div><strong>Facturas pendientes</strong><span>Antigüedad de deuda</span></div><button class="ghost">Ver</button></div></div></div>' +
        '<div class="card" style="margin-top:18px"><div class="card-head"><h3>Resumen financiero</h3><span class="status paid">Estimación</span></div><div class="cards" style="margin:0"><div><div class="label" style="color:#667085;font-size:12px">Ingresos</div><div class="number" style="font-size:22px;margin-top:5px">' + euro(4850) + '</div></div><div><div class="label" style="color:#667085;font-size:12px">Gastos</div><div class="number" style="font-size:22px;margin-top:5px">' + euro(781.30) + '</div></div><div><div class="label" style="color:#667085;font-size:12px">Beneficio</div><div class="number" style="font-size:22px;margin-top:5px;color:#16803c">' + euro(4068.70) + '</div></div><div><div class="label" style="color:#667085;font-size:12px">Margen</div><div class="number" style="font-size:22px;margin-top:5px;color:#16803c">83,9%</div></div></div></div>';
    }

    function renderSettings() {
      setPageMeta('Configuración', 'Personaliza tu empresa y tus documentos');
      $('workspace').innerHTML = '<div class="view-title"><div><h2>Configuración</h2><p>Datos de empresa, numeración, impuestos y apariencia.</p></div><button class="primary" data-action="save-settings">Guardar cambios</button></div>' +
        '<div class="two-columns"><div class="card form"><h3 style="margin:0 0 4px;font-size:16px">Datos de la empresa</h3><p style="margin:0;color:#667085;font-size:12px">Aparecerán en tus facturas.</p><label>Nombre comercial</label><input value="Ruiz y Rivas Consultores"><label>NIF/CIF</label><input value="B12345678"><label>Dirección</label><input value="Calle Mayor 1, Madrid"><label>Correo</label><input value="info@ruizyrivas.es"></div>' +
        '<div class="card"><h3 style="margin:0 0 4px;font-size:16px">Opciones de facturación</h3><div class="setting-line"><div><strong>Numeración automática</strong><span>F-2026-001, F-2026-002...</span></div><div class="switch"></div></div><div class="setting-line"><div><strong>IVA por defecto: 21%</strong><span>Se aplicará a nuevas facturas</span></div><button class="ghost">Cambiar</button></div><div class="setting-line"><div><strong>Verifactu</strong><span>Preparado para facturación electrónica</span></div><span class="status paid">Activo</span></div><div class="setting-line"><div><strong>Recordatorios de pago</strong><span>Enviar avisos automáticos</span></div><div class="switch"></div></div><div class="setting-line"><div><strong>Plantilla de factura</strong><span>Moderna azul</span></div><button class="ghost">Personalizar</button></div></div></div>' +
        '<div class="card" style="margin-top:18px"><div class="card-head"><div><h3 style="margin:0">Cuentas bancarias</h3><span style="color:#667085;font-size:12px">Se podrán elegir al crear una factura</span></div><button class="secondary" data-action="new-account">+ Añadir cuenta</button></div><div>' + state.accounts.map(function(a) { return '<div class="setting-line"><div><strong>' + esc(a.name) + '</strong><span>' + esc(a.iban) + '</span></div><span class="status paid">Disponible</span></div>'; }).join('') + '</div></div>' +
        '<div class="card" style="margin-top:18px"><div class="card-head"><h3>Más opciones que tendría una versión completa</h3></div><div class="feature-grid">' + feature('🏦','Bancos','Conectar cuentas y conciliar movimientos.') + feature('📦','Inventario','Stock, almacenes y pedidos.') + feature('♙','Equipo','Usuarios, permisos y asesoría.') + feature('▤','Factura electrónica','Envío a organismos y clientes.') + feature('↻','Importar datos','Clientes, productos y facturas desde Excel.') + feature('⚙','Integraciones','Conectar tienda, banco o aplicaciones.') + '</div></div>';
    }

    function openModal(title, body, onSubmit) {
      $('modal').innerHTML = '<div class="modal-head"><h3>' + title + '</h3><button class="close" data-action="close-modal">×</button></div>' + body;
      $('modalBackdrop').classList.add('open');
      $('modal').querySelector('form').addEventListener('submit', function(e) { e.preventDefault(); onSubmit(new FormData(e.target)); });
    }
    function closeModal() { $('modalBackdrop').classList.remove('open'); }
    function newInvoice() {
      var clientOptions = state.clients.map(function(c) { return '<option>' + esc(c.name) + '</option>'; }).join('');
      var productOptions = state.products.map(function(p) { return '<option value="' + p.price + '">' + esc(p.name) + '</option>'; }).join('');
      var accountOptions = state.accounts.map(function(a) { return '<option value="' + a.id + '">' + esc(a.name) + ' · ' + esc(a.iban) + '</option>'; }).join('');
      openModal('Nueva factura', '<form class="form"><div class="form-grid"><div><label>Cliente</label><select name="client">' + clientOptions + '</select></div><div><label>Fecha</label><input name="date" value="' + today() + '"></div></div><label>Producto o servicio</label><select id="invoiceProduct" name="product">' + productOptions + '</select><div class="form-grid"><div><label>Precio sin IVA (€)</label><input id="invoicePrice" name="price" type="number" step="0.01" value="' + state.products[0].price + '"></div><div><label>IVA</label><select id="invoiceIva" name="iva"><option value="21">21%</option><option value="10">10%</option><option value="0">Sin IVA</option></select></div></div><div class="form-grid"><div><label>Tipo de cobro</label><select id="invoicePayment" name="payment"><option value="transferencia">Transferencia</option><option value="recibo">Recibo</option><option value="tarjeta">Tarjeta</option><option value="efectivo">Efectivo</option></select></div><div id="invoiceAccountWrap"><label>Cuenta bancaria</label><select id="invoiceAccount" name="account">' + accountOptions + '</select></div></div><div class="mini-info" id="invoicePaymentHint">La cuenta seleccionada aparecerá en la factura como cuenta de cobro.</div><div class="mini-info" id="invoiceTotalPreview">Total estimado: ' + euro(state.products[0].price * 1.21) + '</div><label>Notas</label><textarea name="notes" placeholder="Condiciones de pago..."></textarea><div class="form-actions"><button type="button" class="ghost" data-action="close-modal">Cancelar</button><button class="primary">Crear factura</button></div></form>', function(data) { var subtotal = Number(data.get('price')) || 0; var iva = Number(data.get('iva')) || 0; var account = state.accounts.find(function(a) { return String(a.id) === String(data.get('account')); }); var num = 'F-2026-' + String(state.invoices.length + 5).padStart(3,'0'); state.invoices.unshift({ id:num, client:data.get('client'), date:data.get('date'), status:'Borrador', total:subtotal * (1 + iva / 100), iva:iva, paymentMethod:data.get('payment'), paymentAccount:account ? account.name + ' · ' + account.iban : '' }); closeModal(); state.view = 'facturas'; toast('Factura creada como borrador'); render(); });
      $('invoiceProduct').addEventListener('change', function() { $('invoicePrice').value = this.value; updateInvoicePreview(); });
      $('invoicePrice').addEventListener('input', updateInvoicePreview);
      $('invoiceIva').addEventListener('change', updateInvoicePreview);
      $('invoicePayment').addEventListener('change', updatePaymentFields);
      function updatePaymentFields() { var usesBank = $('invoicePayment').value === 'transferencia' || $('invoicePayment').value === 'recibo'; $('invoiceAccountWrap').style.display = usesBank ? 'block' : 'none'; $('invoicePaymentHint').textContent = usesBank ? 'La cuenta seleccionada aparecerá en la factura como cuenta de cobro.' : 'Este tipo de cobro no necesita mostrar una cuenta bancaria.'; }
      function updateInvoicePreview() { $('invoiceTotalPreview').textContent = 'Total estimado: ' + euro((Number($('invoicePrice').value) || 0) * (1 + (Number($('invoiceIva').value) || 0) / 100)); }
      updatePaymentFields();
    }
    function newClient() {
      openModal('Nuevo cliente', '<form class="form"><label>Nombre o empresa</label><input name="name" required placeholder="Ej.: María López"><label>Correo electrónico</label><input name="email" type="email" required placeholder="cliente@ejemplo.com"><label>NIF/CIF</label><input name="tax" placeholder="12345678A"><div class="form-actions"><button type="button" class="ghost" data-action="close-modal">Cancelar</button><button class="primary">Guardar cliente</button></div></form>', function(data) { state.clients.push({ id:Date.now(), name:data.get('name'), detail:data.get('email'), tax:data.get('tax') || 'Pendiente' }); closeModal(); render(); });
    }
    function newProduct() {
      openModal('Nuevo producto o servicio', '<form class="form"><label>Nombre</label><input name="name" required placeholder="Ej.: Asesoría mensual"><div class="form-grid"><div><label>Código</label><input name="code" placeholder="ASE-001"></div><div><label>Precio sin IVA (€)</label><input name="price" required type="number" step="0.01" placeholder="0,00"></div></div><div class="form-actions"><button type="button" class="ghost" data-action="close-modal">Cancelar</button><button class="primary">Guardar producto</button></div></form>', function(data) { state.products.push({ id:Date.now(), name:data.get('name'), code:data.get('code') || 'SIN-CÓDIGO', price:Number(data.get('price')) || 0 }); closeModal(); render(); });
    }
    function newExpense() {
      openModal('Nuevo gasto', '<form class="form"><label>Proveedor</label><input name="supplier" required placeholder="Ej.: Papelería Central"><div class="form-grid"><div><label>Categoría</label><select name="category"><option>Material</option><option>Suministros</option><option>Oficina</option><option>Transporte</option><option>Otros</option></select></div><div><label>Importe (€)</label><input name="total" required type="number" step="0.01"></div></div><label>Fecha</label><input name="date" value="' + today() + '"><div class="form-actions"><button type="button" class="ghost" data-action="close-modal">Cancelar</button><button class="primary">Guardar gasto</button></div></form>', function(data) { state.expenses.unshift({ id:'G-' + String(state.expenses.length + 15).padStart(3,'0'), supplier:data.get('supplier'), category:data.get('category'), date:data.get('date'), total:Number(data.get('total')) || 0 }); closeModal(); render(); });
    }
    function newQuote() {
      var clientOptions = state.clients.map(function(c) { return '<option>' + esc(c.name) + '</option>'; }).join('');
      openModal('Nuevo presupuesto', '<form class="form"><label>Cliente</label><select name="client">' + clientOptions + '</select><div class="form-grid"><div><label>Descripción</label><input name="description" required placeholder="Ej.: Consultoría inicial"></div><div><label>Total (€)</label><input name="total" required type="number" step="0.01"></div></div><label>Válido hasta</label><input name="date" value="31/12/2026"><div class="form-actions"><button type="button" class="ghost" data-action="close-modal">Cancelar</button><button class="primary">Guardar presupuesto</button></div></form>', function(data) { var num = 'P-2026-' + String(state.quotes.length + 7).padStart(3,'0'); state.quotes.unshift({ id:num, client:data.get('client'), date:today(), status:'Pendiente', total:Number(data.get('total')) || 0, description:data.get('description') }); closeModal(); state.view = 'presupuestos'; toast('Presupuesto guardado'); render(); });
    }
    function newAccount() {
      openModal('Añadir cuenta bancaria', '<form class="form"><label>Nombre de la cuenta</label><input name="name" required placeholder="Ej.: Cuenta BBVA principal"><label>IBAN o número de cuenta</label><input name="iban" required placeholder="ES00 0000 0000 0000 0000 0000"><div class="mini-info">Esta cuenta se podrá elegir después en Nueva factura cuando selecciones Recibo o Transferencia.</div><div class="form-actions"><button type="button" class="ghost" data-action="close-modal">Cancelar</button><button class="primary">Guardar cuenta</button></div></form>', function(data) { state.accounts.push({ id:Date.now(), name:data.get('name'), iban:data.get('iban') }); closeModal(); state.view = 'configuracion'; toast('Cuenta bancaria guardada'); render(); });
    }

    document.addEventListener('click', function(e) {
      var view = e.target.closest('[data-view]');
      if (view) { state.view = view.dataset.view; render(); return; }
      var viewLink = e.target.closest('[data-view-link]');
      if (viewLink) { state.view = viewLink.dataset.viewLink; render(); return; }
      var action = e.target.closest('[data-action]');
      if (!action) return;
      var a = action.dataset.action;
      if (a === 'new-invoice') newInvoice();
      if (a === 'new-client') newClient();
      if (a === 'new-product') newProduct();
      if (a === 'new-expense') newExpense();
      if (a === 'new-account') newAccount();
      if (a === 'close-modal') closeModal();
      if (a === 'print') window.print();
      if (a === 'import') toast('Aquí podrías importar clientes, productos y facturas desde Excel o CSV.');
      if (a === 'reminders') toast('Recordatorios preparados para las facturas pendientes.');
      if (a === 'save-settings') { saveState(); toast('Cambios guardados'); }
      if (a === 'client-detail') toast('Ficha del cliente: facturas, presupuestos, cobros y notas.');
      if (a === 'convert-quote') { var q = state.quotes.find(function(x) { return x.id === action.dataset.id; }); if (q) { state.invoices.unshift({ id:'F-2026-' + String(state.invoices.length + 5).padStart(3,'0'), client:q.client, date:today(), status:'Borrador', total:q.total }); q.status = 'Aceptado'; toast('Presupuesto convertido en factura'); render(); } }
      if (a === 'mark-paid') { var i = state.invoices.find(function(x) { return x.id === action.dataset.id; }); if (i) { i.status = 'Pagada'; toast('Factura marcada como cobrada'); render(); } }
      if (a === 'new-quote') newQuote();
    });
    $('globalSearch').addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var q = this.value.toLowerCase().trim();
      if (!q) return;
      var destination = q.indexOf('fact') >= 0 ? 'facturas' : q.indexOf('presup') >= 0 ? 'presupuestos' : q.indexOf('client') >= 0 ? 'clientes' : q.indexOf('product') >= 0 || q.indexOf('servic') >= 0 ? 'productos' : q.indexOf('gasto') >= 0 ? 'gastos' : q.indexOf('cobr') >= 0 ? 'cobros' : q.indexOf('informe') >= 0 ? 'informes' : null;
      if (destination) { state.view = destination; this.value = ''; render(); } else toast('Prueba con: facturas, clientes, productos, gastos o informes.');
    });
    $('modalBackdrop').addEventListener('click', function(e) { if (e.target === $('modalBackdrop')) closeModal(); });
    render();
  </script>
</body>
</html>

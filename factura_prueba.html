<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruiz y Rivas Consultores - Gestión</title>
  <style>
    :root { --primary:#3157d5; --primary-dark:#2443ac; --soft:#eef2ff; --ink:#172033; --muted:#667085; --line:#e5e7eb; --bg:#f6f8fc; --green:#16803c; --green-bg:#e9f8ee; --orange:#b54708; --orange-bg:#fff3e8; --red:#b42318; --red-bg:#fff0ee; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:var(--bg); }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; display:flex; }
    .sidebar { width:245px; flex:0 0 245px; background:#fff; border-right:1px solid var(--line); padding:22px 14px; }
    .brand { display:flex; flex-direction:column; align-items:flex-start; gap:3px; padding:0 10px 24px; }
    .brand-logo { width:180px; height:92px; object-fit:contain; object-position:left center; }
    .brand strong { display:block; font-size:13px; line-height:1.2; }
    .brand small { color:var(--muted); font-size:11px; }
    .nav-label { color:#98a2b3; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:14px 12px 7px; }
    .nav { display:flex; flex-direction:column; gap:3px; }
    .nav button { border:0; background:transparent; color:#475467; text-align:left; border-radius:9px; padding:10px 12px; font-size:14px; display:flex; align-items:center; gap:10px; }
    .nav button:hover, .nav button.active { color:var(--primary); background:var(--soft); font-weight:700; }
    .nav .icon { width:20px; text-align:center; font-size:16px; }
    .side-note { margin:22px 8px 0; border-radius:12px; background:linear-gradient(135deg,#eef2ff,#f7f4ff); padding:13px; font-size:12px; color:#475467; line-height:1.45; }
    .side-note strong { display:block; color:var(--primary); margin-bottom:3px; }
    .content { flex:1; min-width:0; }
    .topbar { background:#fff; border-bottom:1px solid var(--line); padding:15px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .topbar h1 { margin:0; font-size:22px; }
    .topbar p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .top-actions { display:flex; gap:9px; align-items:center; }
    .search { width:190px; border:1px solid var(--line); border-radius:9px; padding:9px 11px; color:var(--muted); }
    .primary, .secondary, .ghost { border:0; border-radius:9px; padding:10px 14px; font-weight:700; font-size:13px; }
    .primary { color:white; background:var(--primary); }
    .primary:hover { background:var(--primary-dark); }
    .secondary { color:var(--primary); background:var(--soft); }
    .ghost { color:#475467; background:#f8fafc; border:1px solid var(--line); }
    .danger { color:var(--red); background:var(--red-bg); border:1px solid #f3c5c0; }
    .workspace { padding:25px 28px 40px; max-width:1320px; }
    .view-title { display:flex; align-items:flex-start; justify-content:space-between; gap:15px; margin-bottom:20px; }
    .view-title h2 { margin:0; font-size:21px; }
    .view-title p { margin:5px 0 0; color:var(--muted); font-size:13px; }
    .cards { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:14px; margin-bottom:20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 5px 16px rgba(16,24,40,.04); }
    .metric { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .metric .label { color:var(--muted); font-size:12px; }
    .metric .number { margin-top:7px; font-size:24px; font-weight:800; }
    .metric .change { margin-top:8px; font-size:11px; color:var(--green); }
    .metric-icon { width:36px; height:36px; display:grid; place-items:center; border-radius:10px; color:var(--primary); background:var(--soft); }
    .grid-2 { display:grid; grid-template-columns:1.35fr 1fr; gap:18px; }
    .card-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; }
    .card-head h3 { margin:0; font-size:16px; }
    .card-head a { color:var(--primary); font-size:12px; font-weight:700; cursor:pointer; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; color:#98a2b3; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
    td { font-size:13px; padding:13px 8px; border-bottom:1px solid #f0f2f5; white-space:nowrap; }
    tr:last-child td { border-bottom:0; }
    td.amount, th.amount { text-align:right; }
    .status { display:inline-flex; align-items:center; border-radius:20px; padding:5px 9px; font-size:11px; font-weight:700; }
    .paid { color:var(--green); background:var(--green-bg); }
    .pending { color:var(--orange); background:var(--orange-bg); }
    .draft { color:#475467; background:#f2f4f7; }
    .rejected { color:var(--red); background:var(--red-bg); }
    .progress-row { margin:15px 0; }
    .progress-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:7px; }
    .progress-label span:last-child { color:var(--muted); }
    .progress { height:8px; border-radius:9px; background:#eef0f4; overflow:hidden; }
    .progress i { display:block; height:100%; border-radius:9px; background:var(--primary); }
    .feature-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .feature { border:1px solid var(--line); border-radius:12px; padding:15px; background:#fff; }
    .feature .ficon { font-size:20px; margin-bottom:8px; }
    .feature strong { display:block; font-size:13px; }
    .feature span { display:block; color:var(--muted); font-size:12px; line-height:1.4; margin-top:4px; }
    .toolbar { display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar input, .toolbar select, .form input, .form select, .form textarea { border:1px solid #d0d5dd; border-radius:8px; padding:10px 11px; background:#fff; color:var(--ink); }
    .toolbar input { min-width:220px; }
    .list-card { overflow:hidden; }
    .empty { color:var(--muted); text-align:center; padding:35px 10px; font-size:13px; }
    .two-columns { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .form label { display:block; font-size:12px; font-weight:700; margin:12px 0 5px; }
    .form input, .form select, .form textarea { width:100%; }
    .form textarea { min-height:80px; resize:vertical; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .account-options { display:grid; gap:8px; border:1px solid #d0d5dd; border-radius:8px; padding:10px; background:#fff; }
    .account-option { display:flex; align-items:flex-start; gap:8px; color:var(--ink); font-size:12px; line-height:1.35; cursor:pointer; }
    .account-option input { width:auto; margin-top:2px; }
    .invoice-lines-card { margin-top:14px; border:1px solid var(--line); border-radius:11px; padding:12px; background:#fbfcfe; }
    .invoice-line { display:grid; grid-template-columns:minmax(150px,1.5fr) minmax(100px,.7fr) minmax(95px,.55fr) auto; gap:8px; align-items:end; padding:9px 0; border-bottom:1px solid var(--line); }
    .invoice-line:last-child { border-bottom:0; }
    .invoice-line label { margin:0; }
    .invoice-line input, .invoice-line select { width:100%; }
    .line-remove { padding:9px 10px; }
    .invoice-summary { display:grid; gap:7px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; }
    .invoice-summary-row { display:flex; justify-content:space-between; gap:12px; }
    .invoice-summary-row span { color:var(--muted); }
    .invoice-summary-row.total { font-size:15px; color:var(--ink); }
    .tax-summary { display:grid; gap:3px; padding:5px 0; }
    .tax-summary div { display:flex; justify-content:space-between; gap:12px; }
    .print-invoice { white-space:nowrap; }
    .form-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:18px; }
    .mini-info { border-radius:10px; background:#f8fafc; padding:12px; color:#475467; font-size:12px; line-height:1.5; margin-top:14px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(16,24,40,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
    .modal-backdrop.open { display:flex; }
    .modal { width:min(560px,100%); max-height:90vh; overflow:auto; background:#fff; border-radius:16px; padding:23px; box-shadow:0 20px 55px rgba(16,24,40,.25); }
    .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .modal-head h3 { margin:0; font-size:19px; }
    .close { border:0; background:#f2f4f7; border-radius:50%; width:30px; height:30px; color:#667085; }
    .toast { position:fixed; right:22px; bottom:22px; z-index:20; max-width:340px; padding:13px 16px; border-radius:11px; color:#fff; background:#172033; box-shadow:0 12px 30px rgba(16,24,40,.22); font-size:13px; opacity:0; transform:translateY(12px); pointer-events:none; transition:.22s ease; }
    .toast.show { opacity:1; transform:translateY(0); }
    .chart { display:flex; height:180px; align-items:flex-end; gap:12px; padding:20px 5px 0; border-bottom:1px solid var(--line); }
    .bar-wrap { flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; }
    .bar { width:100%; max-width:34px; border-radius:7px 7px 0 0; background:linear-gradient(#6d5dfc,var(--primary)); min-height:8px; }
    .bar-label { color:var(--muted); font-size:11px; }
    .setting-line { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:14px 0; gap:15px; }
    .row-actions { display:flex; gap:6px; justify-content:flex-end; }
    .setting-line:last-child { border-bottom:0; }
    .setting-line strong { display:block; font-size:13px; }
    .setting-line span { display:block; color:var(--muted); font-size:12px; margin-top:3px; }
    .switch { width:40px; height:22px; border-radius:20px; background:var(--primary); position:relative; }
    .switch:after { content:''; position:absolute; right:3px; top:3px; width:16px; height:16px; border-radius:50%; background:#fff; }
    @media (max-width:900px) { .sidebar { width:210px; flex-basis:210px; } .cards { grid-template-columns:repeat(2,1fr); } .grid-2, .two-columns { grid-template-columns:1fr; } .invoice-line { grid-template-columns:1fr 1fr; } .invoice-line .line-description { grid-column:1 / -1; } }
    @media (max-width:650px) { .app { display:block; } .sidebar { width:100%; padding:12px; border-right:0; border-bottom:1px solid var(--line); } .brand { padding-bottom:10px; } .nav-label, .side-note { display:none; } .nav { display:grid; grid-template-columns:repeat(4,1fr); } .nav button { padding:8px 3px; justify-content:center; flex-direction:column; gap:2px; font-size:10px; } .nav button:nth-child(n+9) { display:none; } .topbar { padding:14px 16px; } .topbar p, .search { display:none; } .workspace { padding:18px 16px 28px; } .cards { gap:9px; } .card { padding:14px; } .metric .number { font-size:19px; } .feature-grid { grid-template-columns:1fr 1fr; } }
    @media print { .sidebar, .topbar, .view-title button, .toolbar, .modal-backdrop { display:none !important; } .app, .content { display:block; } .workspace { padding:0; } .card { box-shadow:none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="logo_ruiz_rivas.png" alt="Ruiz y Rivas Consultores">
        <small>Panel de gestión</small>
      </div>
      <div class="nav-label">Principal</div>
      <nav class="nav">
        <button data-view="inicio" class="active"><span class="icon">⌂</span>Inicio</button>
        <button data-view="facturas"><span class="icon">▤</span>Facturas</button>
        <button data-view="presupuestos"><span class="icon">☷</span>Presupuestos</button>
        <button data-view="clientes"><span class="icon">♙</span>Clientes</button>
        <button data-view="productos"><span class="icon">▦</span>Productos</button>
        <button data-view="gastos"><span class="icon">↓</span>Gastos</button>
        <button data-view="cobros"><span class="icon">€</span>Cobros</button>
      </nav>
      <div class="nav-label">Control</div>
      <nav class="nav">
        <button data-view="informes"><span class="icon">◒</span>Informes</button>
        <button data-view="configuracion"><span class="icon">⚙</span>Configuración</button>
      </nav>
      <div class="side-note"><strong>✓ Verifactu preparado</strong>Esta demo incluye un espacio para la configuración de facturación electrónica y numeración.</div>
    </aside>
    <section class="content">
      <header class="topbar">
        <div><h1 id="pageTitle">Inicio</h1><p id="pageSubtitle">Resumen de la actividad de tu negocio</p></div>
        <div class="top-actions"><input id="globalSearch" class="search" placeholder="Buscar..."><button class="primary" data-action="new-invoice">+ Nueva factura</button></div>
      </header>
      <main id="workspace" class="workspace"></main>
    </section>
  </div>
  <div id="modalBackdrop" class="modal-backdrop"><div id="modal" class="modal"></div></div>
  <div id="toast" class="toast"></div>

  <script>
    var state = {
      view: 'inicio',
      clients: [
        { id:1, name:'María López', detail:'maria@ejemplo.com', tax:'12345678A' },
        { id:2, name:'Construcciones Norte S.L.', detail:'admin@norte.es', tax:'B12345678' },
        { id:3, name:'Estudio Marín', detail:'hola@estudiomarin.es', tax:'B87654321' }
      ],
      products: [
        { id:1, name:'Consultoría empresarial', code:'CONS-001', price:850 },
        { id:2, name:'Diseño de logotipo', code:'DIS-001', price:250 },
        { id:3, name:'Mantenimiento mensual', code:'MANT-001', price:450 }
      ],
      invoices: [
        { id:'F-2026-004', client:'Estudio Marín', date:'22/10/2026', status:'Pagada', total:2450 },
        { id:'F-2026-003', client:'Construcciones Norte S.L.', date:'18/10/2026', status:'Pendiente', total:1340 },
        { id:'F-2026-002', client:'María López', date:'10/10/2026', status:'Pagada', total:850 },
        { id:'F-2026-001', client:'Servicios Delta', date:'02/10/2026', status:'Borrador', total:620 }
      ],
      quotes: [
        { id:'P-2026-006', client:'Talleres Vega', date:'21/10/2026', status:'Pendiente', total:1890 },
        { id:'P-2026-005', client:'Construcciones Norte S.L.', date:'16/10/2026', status:'Aceptado', total:1340 },
        { id:'P-2026-004', client:'Estudio Marín', date:'09/10/2026', status:'Rechazado', total:920 }
      ],
      expenses: [
        { id:'G-014', supplier:'Papelería Central', date:'20/10/2026', category:'Material', total:86.40 },
        { id:'G-013', supplier:'Internet y teléfono', date:'15/10/2026', category:'Suministros', total:74.90 },
        { id:'G-012', supplier:'Alquiler oficina', date:'01/10/2026', category:'Oficina', total:620 }
      ],
      accounts: [
        { id:1, name:'Cuenta principal', iban:'ES00 0000 0000 0000 0000 0000' },
        { id:2, name:'Cuenta secundaria', iban:'ES00 0000 0000 0000 0000 0001' }
      ]
    };
    var storageKey = 'ruiz-rivas-facturacion-v2';
    try {
      var saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
      if (saved) {
        state.clients = saved.clients || state.clients;
        state.products = saved.products || state.products;
        state.invoices = saved.invoices || state.invoices;
        state.quotes = saved.quotes || state.quotes;
        state.expenses = saved.expenses || state.expenses;
        state.accounts = saved.accounts || state.accounts;
      }
    } catch (e) {}
    var euro = function(n) { return Number(n).toLocaleString('es-ES', { style:'currency', currency:'EUR' }); };
    var esc = function(s) { return String(s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]; }); };
    var today = function() { return new Date().toLocaleDateString('es-ES'); };
    var statusClass = function(s) { return s === 'Pagada' || s === 'Aceptado' ? 'paid' : s === 'Pendiente' || s === 'Enviada' ? 'pending' : s === 'Rechazado' ? 'rejected' : 'draft'; };
    var statusBadge = function(s) { return '<span class="status ' + statusClass(s) + '">' + esc(s) + '</span>'; };
    var paymentNames = { transferencia:'Transferencia', recibo:'Recibo', tarjeta:'Tarjeta', efectivo:'Efectivo' };
    var paymentLabel = function(i) { if (!i.paymentMethod) return '—'; var labels = paymentNames; var accounts = Array.isArray(i.paymentAccounts) ? i.paymentAccounts : (i.paymentAccount ? [i.paymentAccount] : []); var usesBank = i.paymentMethod === 'transferencia' || i.paymentMethod === 'recibo'; return '<strong>' + (labels[i.paymentMethod] || esc(i.paymentMethod)) + '</strong>' + (usesBank && accounts.length ? '<br><small style="color:#667085">' + accounts.map(function(a) { return esc(a); }).join('<br>') + '</small>' : ''); };
    var vatOptions = function(selected) { return [{ value:21, label:'21%' }, { value:10, label:'10%' }, { value:4, label:'4%' }, { value:2, label:'2%' }, { value:0, label:'Sin IVA' }].map(function(v) { return '<option value="' + v.value + '"' + (Number(selected) === v.value ? ' selected' : '') + '>' + v.label + '</option>'; }).join(''); };
    function getInvoiceLines(invoice) {
      if (Array.isArray(invoice.lines) && invoice.lines.length) return invoice.lines.map(function(line) { return { description:line.description || 'Servicio o producto', base:Number(line.base) || 0, iva:Number(line.iva) || 0 }; });
      var iva = invoice.iva == null ? 21 : Number(invoice.iva);
      var base = invoice.subtotal == null ? Number(invoice.total || 0) / (1 + iva / 100) : Number(invoice.subtotal);
      return [{ description:invoice.description || 'Servicio o producto', base:Number(base.toFixed(2)), iva:iva }];
    }
    function invoiceTotals(lines) {
      var totals = { base:0, tax:0, total:0, byRate:{} };
      lines.forEach(function(line) { var base = Number(line.base) || 0; var iva = Number(line.iva) || 0; var tax = base * iva / 100; totals.base += base; totals.tax += tax; var key = String(iva); if (!totals.byRate[key]) totals.byRate[key] = { rate:iva, base:0, tax:0 }; totals.byRate[key].base += base; totals.byRate[key].tax += tax; });
      totals.total = totals.base + totals.tax;
      return totals;
    }
    function invoiceLineRow(line, removable) {
      return '<div class="invoice-line"><div class="line-description"><label>Descripción</label><input name="lineDescription" value="' + esc(line.description || '') + '" placeholder="Ej.: Consultoría empresarial"></div><div><label>Base imponible (€)</label><input name="lineBase" type="number" min="0" step="0.01" value="' + Number(line.base || 0).toFixed(2) + '"></div><div><label>IVA</label><select name="lineIva">' + vatOptions(line.iva) + '</select></div><button type="button" class="ghost line-remove" data-action="remove-invoice-line"' + (removable ? '' : ' disabled') + '>Quitar</button></div>';
    }
    function readInvoiceLines() {
      return Array.prototype.slice.call(document.querySelectorAll('#invoiceLines .invoice-line')).map(function(row) { return { description:row.querySelector('[name="lineDescription"]').value.trim() || 'Servicio o producto', base:Number(row.querySelector('[name="lineBase"]').value) || 0, iva:Number(row.querySelector('[name="lineIva"]').value) || 0 }; });
    }
    function taxSummaryHtml(totals) {
      return Object.keys(totals.byRate).sort(function(a,b) { return Number(b) - Number(a); }).map(function(key) { var row = totals.byRate[key]; return '<div><span>Base ' + (row.rate ? row.rate + '%' : 'sin IVA') + ': ' + euro(row.base) + '</span><strong>IVA: ' + euro(row.tax) + '</strong></div>'; }).join('');
    }
    function refreshInvoiceLineSummary() {
      var lines = readInvoiceLines();
      var totals = invoiceTotals(lines);
      if ($('invoiceBaseTotal')) $('invoiceBaseTotal').textContent = euro(totals.base);
      if ($('invoiceTaxSummary')) $('invoiceTaxSummary').innerHTML = taxSummaryHtml(totals);
      if ($('invoiceGrandTotal')) $('invoiceGrandTotal').textContent = euro(totals.total);
    }
    function addInvoiceLine() {
      var lines = $('invoiceLines');
      if (!lines) return;
      lines.insertAdjacentHTML('beforeend', invoiceLineRow({ description:'Nueva línea', base:0, iva:21 }, true));
      refreshInvoiceLineSummary();
    }
    function removeInvoiceLine(button) {
      var rows = document.querySelectorAll('#invoiceLines .invoice-line');
      if (rows.length <= 1) { toast('Debe quedar al menos una línea en la factura'); return; }
      button.closest('.invoice-line').remove();
      refreshInvoiceLineSummary();
    }
    var $ = function(id) { return document.getElementById(id); };
    function saveState() {
      try { localStorage.setItem(storageKey, JSON.stringify({ clients:state.clients, products:state.products, invoices:state.invoices, quotes:state.quotes, expenses:state.expenses, accounts:state.accounts })); } catch (e) {}
    }
    function toast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(function() { $('toast').classList.remove('show'); }, 2600);
    }

    function setPageMeta(title, subtitle) {
      $('pageTitle').textContent = title;
      $('pageSubtitle').textContent = subtitle;
      document.querySelectorAll('[data-view]').forEach(function(b) { b.classList.toggle('active', b.dataset.view === state.view); });
    }

    function render() {
      var views = { inicio:renderHome, facturas:renderInvoices, presupuestos:renderQuotes, clientes:renderClients, productos:renderProducts, gastos:renderExpenses, cobros:renderPayments, informes:renderReports, configuracion:renderSettings };
      (views[state.view] || renderHome)();
      saveState();
    }

    function renderHome() {
      setPageMeta('Inicio', 'Resumen de la actividad de tu negocio');
      var sales = state.invoices.filter(function(i) { return i.status === 'Pagada'; }).reduce(function(a,i) { return a + i.total; }, 0);
      var pending = state.invoices.filter(function(i) { return i.status === 'Pendiente'; }).reduce(function(a,i) { return a + i.total; }, 0);
      var expenses = state.expenses.reduce(function(a,i) { return a + i.total; }, 0);

      return '<section class="invoice-paper"><div class="print-head"><div><img src="' + new URL('logo_ruiz_rivas.png', document.location.href).href + '" alt="Ruiz y Rivas Consultores"><h1>Ruiz y Rivas Consultores</h1></div><div class="print-title"><strong>FACTURA</strong><span>' + esc(invoice.id) + '</span></div></div><div class="print-meta"><div><strong>Cliente</strong><span>' + esc(invoice.client) + '</span></div><div><strong>Fecha</strong><span>' + esc(invoice.date) + '</span></div><div><strong>Estado</strong><span>' + esc(invoice.status) + '</span></div><div><strong>Forma de cobro</strong><span>' + (paymentNames[invoice.paymentMethod] || 'No indicada') + '</span></div></div><table class="print-lines"><thead><tr><th>Descripción</th><th class="num">Base imponible</th><th class="num">IVA</th><th class="num">Cuota IVA</th><th class="num">Total</th></tr></thead><tbody>' + lineRows + '</tbody></table><div class="print-bottom"><div class="print-notes"><strong>Cuentas de cobro</strong><span>' + (accounts.length ? accounts.map(function(a) { return esc(a); }).join('<br>') : 'No indicada') + '</span><strong>Notas</strong><span>' + esc(invoice.notes || '—') + '</span></div><div class="print-totals"><div><span>Base imponible</span><strong>' + euro(totals.base) + '</strong></div><div class="print-tax-summary">' + taxSummaryHtml(totals) + '</div><div class="grand"><span>Total factura</span><strong>' + euro(totals.total) + '</strong></div></div></div></section>';
    }
    function openPrintDocument(title, body) {
      var popup = window.open('', '_blank');
      if (!popup) { toast('El navegador ha bloqueado la ventana del PDF. Permite las ventanas emergentes e inténtalo de nuevo.'); return; }
      popup.document.open();
      popup.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#172033;margin:0;background:#fff;font-size:12px}.invoice-paper{page-break-after:always;padding-bottom:8mm}.invoice-paper:last-child{page-break-after:auto}.print-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #3157d5;padding-bottom:14px;margin-bottom:18px}.print-head img{width:120px;height:68px;object-fit:contain;object-position:left center;display:block}.print-head h1{font-size:14px;margin:3px 0 0;color:#3157d5}.print-title{text-align:right;display:flex;flex-direction:column;gap:5px;font-size:15px}.print-title strong{font-size:24px;letter-spacing:.08em;color:#3157d5}.print-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.print-meta div{border:1px solid #e5e7eb;border-radius:8px;padding:9px}.print-meta strong,.print-notes strong{display:block;color:#667085;font-size:10px;text-transform:uppercase;margin-bottom:4px}.print-meta span{display:block;font-size:12px}.print-lines{width:100%;border-collapse:collapse;margin-bottom:20px}.print-lines th{background:#f1f4ff;color:#3157d5;text-align:left;font-size:10px;text-transform:uppercase;padding:9px 7px;border-bottom:1px solid #dce3ff}.print-lines td{padding:10px 7px;border-bottom:1px solid #e5e7eb}.num{text-align:right}.print-bottom{display:grid;grid-template-columns:1.3fr .7fr;gap:30px}.print-notes{display:grid;gap:5px;align-content:start}.print-notes strong:nth-of-type(2){margin-top:13px}.print-totals{border:1px solid #e5e7eb;border-radius:8px;padding:12px}.print-totals>div{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.print-tax-summary{display:block!important;font-size:11px;color:#667085;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;margin:5px 0}.print-tax-summary div{display:flex;justify-content:space-between;padding:3px 0}.print-totals .grand{font-size:16px;color:#3157d5;padding-top:10px}@media print{.invoice-paper{break-after:page}.invoice-paper:last-child{break-after:auto}}</style></head><body>' + body + '</body></html>');
      popup.document.close();
      setTimeout(function() { popup.focus(); popup.print(); }, 450);
    }
    function printInvoice(id) {
      var invoice = state.invoices.find(function(i) { return String(i.id) === String(id); });
      if (invoice) openPrintDocument('Factura ' + invoice.id, printableInvoiceBlock(invoice));
    }
    function printAllInvoices() {
      if (!state.invoices.length) { toast('No hay facturas para descargar'); return; }
      openPrintDocument('Facturas Ruiz y Rivas Consultores', state.invoices.map(printableInvoiceBlock).join(''));
    }
    function printableClientBlock(client) {
      var invoices = state.invoices.filter(function(invoice) { return invoice.client === client.name; });
      var rows = invoices.length ? invoices.map(function(invoice) { return '<tr><td>' + esc(invoice.id) + '</td><td>' + esc(invoice.date) + '</td><td>' + esc(invoice.status) + '</td><td class="num">' + euro(invoice.total) + '</td></tr>'; }).join('') : '<tr><td colspan="4">No hay facturas asociadas.</td></tr>';
      return '<section class="invoice-paper"><div class="print-head"><div><img src="' + new URL('logo_ruiz_rivas.png', document.location.href).href + '" alt="Ruiz y Rivas Consultores"><h1>Ruiz y Rivas Consultores</h1></div><div class="print-title"><strong>CLIENTE</strong><span>Ficha</span></div></div><div class="print-meta"><div><strong>Nombre o empresa</strong><span>' + esc(client.name) + '</span></div><div><strong>Correo</strong><span>' + esc(client.detail) + '</span></div><div><strong>NIF/CIF</strong><span>' + esc(client.tax) + '</span></div><div><strong>Facturas</strong><span>' + invoices.length + '</span></div></div><h2 style="font-size:16px;margin:0 0 10px">Historial de facturas</h2><table class="print-lines"><thead><tr><th>Número</th><th>Fecha</th><th>Estado</th><th class="num">Total</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
    }
    function printClient(id) {
      var client = state.clients.find(function(c) { return String(c.id) === String(id); });
      if (client) openPrintDocument('Cliente ' + client.name, printableClientBlock(client));
    }
    function printAllClients() {
      if (!state.clients.length) { toast('No hay clientes para descargar'); return; }
      openPrintDocument('Clientes Ruiz y Rivas Consultores', state.clients.map(printableClientBlock).join(''));
    }
    function printableQuoteBlock(quote) {
      var client = state.clients.find(function(c) { return c.name === quote.client; });
      return '<section class="invoice-paper"><div class="print-head"><div><img src="' + new URL('logo_ruiz_rivas.png', document.location.href).href + '" alt="Ruiz y Rivas Consultores"><h1>Ruiz y Rivas Consultores</h1></div><div class="print-title"><strong>PRESUPUESTO</strong><span>' + esc(quote.id) + '</span></div></div><div class="print-meta"><div><strong>Cliente</strong><span>' + esc(quote.client) + '</span></div><div><strong>Válido hasta</strong><span>' + esc(quote.date) + '</span></div><div><strong>Estado</strong><span>' + esc(quote.status) + '</span></div><div><strong>Contacto</strong><span>' + esc(client ? client.detail : '—') + '</span></div></div><table class="print-lines"><thead><tr><th>Descripción</th><th class="num">Total</th></tr></thead><tbody><tr><td>' + esc(quote.description || '—') + '</td><td class="num">' + euro(quote.total) + '</td></tr></tbody></table><div class="print-bottom"><div class="print-notes"><strong>Notas</strong><span>' + esc(quote.notes || '—') + '</span></div><div class="print-totals"><div class="grand"><span>Total presupuesto</span><strong>' + euro(quote.total) + '</strong></div></div></div></section>';
    }
    function printQuote(id) {
      var quote = state.quotes.find(function(q) { return String(q.id) === String(id); });
      if (quote) openPrintDocument('Presupuesto ' + quote.id, printableQuoteBlock(quote));
    }
    function printAllQuotes() {
      if (!state.quotes.length) { toast('No hay presupuestos para descargar'); return; }
      openPrintDocument('Presupuestos Ruiz y Rivas Consultores', state.quotes.map(printableQuoteBlock).join(''));
    }
    function printableProductBlock(productList) {
      var rows = productList.map(function(product) { return '<tr><td>' + esc(product.name) + '</td><td>' + esc(product.code) + '</td><td>Servicio</td><td class="num">' + euro(product.price) + '</td></tr>'; }).join('');
      return '<section class="invoice-paper"><div class="print-head"><div><img src="' + new URL('logo_ruiz_rivas.png', document.location.href).href + '" alt="Ruiz y Rivas Consultores"><h1>Ruiz y Rivas Consultores</h1></div><div class="print-title"><strong>PRODUCTOS</strong><span>Catálogo</span></div></div><table class="print-lines"><thead><tr><th>Producto o servicio</th><th>Código</th><th>Tipo</th><th class="num">Precio sin IVA</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
    }
    function printProduct(id) {
      var product = state.products.find(function(p) { return String(p.id) === String(id); });
      if (product) openPrintDocument('Producto ' + product.name, printableProductBlock([product]));
    }
    function printAllProducts() {
      if (!state.products.length) { toast('No hay productos para descargar'); return; }
      openPrintDocument('Productos Ruiz y Rivas Consultores', printableProductBlock(state.products));
    }
    function printableExpenseBlock(expenseList) {
      var rows = expenseList.map(function(expense) { return '<tr><td>' + esc(expense.id) + '</td><td>' + esc(expense.supplier) + '</td><td>' + esc(expense.category) + '</td><td>' + esc(expense.date) + '</td><td class="num">' + euro(expense.total) + '</td></tr>'; }).join('');
      var total = expenseList.reduce(function(sum, expense) { return sum + Number(expense.total || 0); }, 0);
      return '<section class="invoice-paper"><div class="print-head"><div><img src="' + new URL('logo_ruiz_rivas.png', document.location.href).href + '" alt="Ruiz y Rivas Consultores"><h1>Ruiz y Rivas Consultores</h1></div><div class="print-title"><strong>GASTOS</strong><span>Registro</span></div></div><table class="print-lines"><thead><tr><th>Número</th><th>Proveedor</th><th>Categoría</th><th>Fecha</th><th class="num">Total</th></tr></thead><tbody>' + rows + '</tbody></table><div class="print-totals" style="max-width:280px;margin-left:auto"><div class="grand"><span>Total gastos</span><strong>' + euro(total) + '</strong></div></div></section>';
    }
    function printExpense(id) {
      var expense = state.expenses.find(function(e) { return String(e.id) === String(id); });
      if (expense) openPrintDocument('Gasto ' + expense.id, printableExpenseBlock([expense]));
    }
    function printAllExpenses() {
      if (!state.expenses.length) { toast('No hay gastos para descargar'); return; }
      openPrintDocument('Gastos Ruiz y Rivas Consultores', printableExpenseBlock(state.expenses));
    }
    function printAllPayments() {
      if (!state.invoices.length) { toast('No hay cobros para descargar'); return; }
      var rows = state.invoices.map(function(invoice) { var accounts = Array.isArray(invoice.paymentAccounts) ? invoice.paymentAccounts.map(function(account) { return esc(account); }).join('<br>') : esc(invoice.paymentAccount || '—'); return '<tr><td>' + esc(invoice.id) + '</td><td>' + esc(invoice.client) + '</td><td>' + esc(invoice.status) + '</td><td>' + (paymentNames[invoice.paymentMethod] || '—') + '</td><td>' + accounts + '</td><td class="num">' + euro(invoice.total) + '</td></tr>'; }).join('');
      openPrintDocument('Cobros Ruiz y Rivas Consultores', '<section class="invoice-paper"><div class="print-head"><div><img src="' + new URL('logo_ruiz_rivas.png', document.location.href).href + '" alt="Ruiz y Rivas Consultores"><h1>Ruiz y Rivas Consultores</h1></div><div class="print-title"><strong>COBROS</strong><span>Registro</span></div></div><table class="print-lines"><thead><tr><th>Factura</th><th>Cliente</th><th>Estado</th><th>Forma</th><th>Cuentas</th><th class="num">Importe</th></tr></thead><tbody>' + rows + '</tbody></table></section>');
    }

    document.addEventListener('click', function(e) {
      var view = e.target.closest('[data-view]');
      if (view) { state.view = view.dataset.view; render(); return; }
      var viewLink = e.target.closest('[data-view-link]');
      if (viewLink) { state.view = viewLink.dataset.viewLink; render(); return; }
      var action = e.target.closest('[data-action]');
      if (!action) return;
      var a = action.dataset.action;
      if (a === 'new-invoice') newInvoice();
      if (a === 'new-client') newClient();
      if (a === 'new-product') newProduct();
      if (a === 'new-expense') newExpense();
      if (a === 'new-account') newAccount();
      if (a === 'edit-account') editAccount(action.dataset.id);
      if (a === 'edit-invoice') editInvoice(action.dataset.id);
      if (a === 'delete-invoice') deleteInvoice(action.dataset.id);
      if (a === 'edit-client') editClient(action.dataset.id);
      if (a === 'delete-client') deleteClient(action.dataset.id);
      if (a === 'print-client') printClient(action.dataset.id);
      if (a === 'print-all-clients') printAllClients();
      if (a === 'edit-quote') editQuote(action.dataset.id);
      if (a === 'delete-quote') deleteQuote(action.dataset.id);
      if (a === 'print-quote') printQuote(action.dataset.id);
      if (a === 'print-all-quotes') printAllQuotes();
      if (a === 'edit-product') editProduct(action.dataset.id);
      if (a === 'delete-product') deleteProduct(action.dataset.id);
      if (a === 'print-product') printProduct(action.dataset.id);
      if (a === 'print-all-products') printAllProducts();
      if (a === 'edit-expense') editExpense(action.dataset.id);
      if (a === 'delete-expense') deleteExpense(action.dataset.id);
      if (a === 'print-expense') printExpense(action.dataset.id);
      if (a === 'print-all-expenses') printAllExpenses();
      if (a === 'print-all-payments') printAllPayments();
      if (a === 'add-invoice-line') addInvoiceLine();
      if (a === 'remove-invoice-line') removeInvoiceLine(action);
      if (a === 'print-invoice') printInvoice(action.dataset.id);
      if (a === 'print-all-invoices') printAllInvoices();
      if (a === 'close-modal') closeModal();
      if (a === 'print') window.print();
      if (a === 'import') toast('Aquí podrías importar clientes, productos y facturas desde Excel o CSV.');
      if (a === 'reminders') toast('Recordatorios preparados para las facturas pendientes.');
      if (a === 'save-settings') { saveState(); toast('Cambios guardados'); }
      if (a === 'client-detail') toast('Ficha del cliente: facturas, presupuestos, cobros y notas.');
      if (a === 'convert-quote') { var q = state.quotes.find(function(x) { return x.id === action.dataset.id; }); if (q) { state.invoices.unshift({ id:'F-2026-' + String(state.invoices.length + 5).padStart(3,'0'), client:q.client, date:today(), status:'Borrador', total:q.total }); q.status = 'Aceptado'; toast('Presupuesto convertido en factura'); render(); } }
      if (a === 'mark-paid') { var i = state.invoices.find(function(x) { return x.id === action.dataset.id; }); if (i) { i.status = 'Pagada'; toast('Factura marcada como cobrada'); render(); } }
      if (a === 'new-quote') newQuote();
    });
    $('globalSearch').addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      var q = this.value.toLowerCase().trim();
      if (!q) return;
      var destination = q.indexOf('fact') >= 0 ? 'facturas' : q.indexOf('presup') >= 0 ? 'presupuestos' : q.indexOf('client') >= 0 ? 'clientes' : q.indexOf('product') >= 0 || q.indexOf('servic') >= 0 ? 'productos' : q.indexOf('gasto') >= 0 ? 'gastos' : q.indexOf('cobr') >= 0 ? 'cobros' : q.indexOf('informe') >= 0 ? 'informes' : null;
      if (destination) { state.view = destination; this.value = ''; render(); } else toast('Prueba con: facturas, clientes, productos, gastos o informes.');
    });
    $('modalBackdrop').addEventListener('click', function(e) { if (e.target === $('modalBackdrop')) closeModal(); });
    render();
  </script>
</body>
</html>
